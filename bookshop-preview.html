<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookshop sorting - game 11</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 1000px; margin: 1rem auto; padding: 1rem; }
      #bookshop-board { padding: 20px; background: #302a23; border: 2px solid #ae9061; border-radius: 12px; }
      #bookshop-board [role="group"] { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 170px)); justify-content: center; align-items: start; gap: 18px; margin: 20px 0; }
      #bookshop-board [data-command="select"] { width: 100%; min-width: 0; padding: 0; color: #f3e6c8; background: #25211c; border: 1px solid #8f795b; border-radius: 3px 8px 8px 3px; white-space: normal; text-align: center; overflow-wrap: anywhere; }
      .book-cover { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 264px; padding: 12px; border-left: 7px solid #574331; background: #302d27; }
      .book-cover-title { display: flex; align-items: center; justify-content: center; min-height: 72px; font-size: 14px; line-height: 1.3; }
      .book-cover-art { display: block; width: 100px; height: 100px; flex-shrink: 0; }
      .book-cover-author { font-size: 11px; line-height: 1.4; min-height: 32px; display: flex; align-items: center; }
      .book-summary { display: block; min-height: 110px; padding: 10px; font-size: 11px; line-height: 1.4; color: #c9bd9f; text-align: left; }
      #bookshop-board [data-command="select"]:disabled { opacity: .45; }
      #bookshop-board [aria-pressed="true"] { outline: 3px solid #f3cc7d; outline-offset: 3px; }
      #bookshop-board fieldset { margin: 18px 0; border: 0; border-bottom: 12px solid #805c37; background: #211e1a; }
      #bookshop-board [data-command="place"] { margin: 6px; min-width: 130px; min-height: 65px; max-width: 200px; white-space: normal; }
      #bookshop-board [role="timer"] { color: #f3cc7d; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
      #bookshop-board button:focus-visible { outline: 3px solid #f3cc7d; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <button id="preview-sound" type="button" aria-pressed="true"></button>
      <p id="preview-difficulty"></p>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <p id="preview-audio-error" role="alert"></p>
      <div id="bookshop-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Français</a></p>
    </main>
    <script type="module" src="./bookshop-preview.mjs"></script>
  </body>
</html>
