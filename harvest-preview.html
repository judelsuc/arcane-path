<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grape harvest - game 5</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 900px; margin: 2rem auto; padding: 1rem; }
      #harvest-board button { margin: 8px; min-height: 64px; padding: 12px; border-radius: 12px; }
      #harvest-board section { text-align: center; padding: 16px; background: #203528; border: 1px solid var(--line); }
      .harvest-field { position: relative; width: 100%; max-width: 700px; height: clamp(300px, 48vh, 450px); margin: 12px auto; overflow: hidden; border: 3px solid #799551; border-radius: 16px; background: radial-gradient(ellipse at 50% 10%, #d9dfa0, #8faa69 65%, #576943); box-shadow: inset 0 -28px 0 #634e34; }
      .harvest-vine { position: absolute; inset: 0 0 auto; height: 24px; background: repeating-linear-gradient(125deg, #3f682f 0 25px, #608a3a 25px 45px, #324f29 45px 60px); border-bottom: 5px solid #755235; border-radius: 0 0 35% 30%; }
      .harvest-baskets { position: absolute; bottom: 0; width: 100%; display: flex; align-items: flex-end; }
      .harvest-basket { position: relative; flex: 1 1 0; min-width: 0; border-top: 3px solid transparent; border-radius: 12px 12px 0 0; padding-top: 4px; }
      .harvest-basket svg { display: block; width: 100%; max-width: 112px; height: 90px; margin: auto; }
      .harvest-basket-label { display: block; background: #25331fe8; font-size: clamp(0.65rem, 2vw, 1rem); padding: 4px 0; font-weight: bold; }
      .harvest-basket[data-under="true"] { border-top-color: #fff2ac; background: #fff3ab33; }
      .harvest-grape { position: absolute; width: clamp(40px, 8vw, 65px); height: 72px; transform: translate(-50%, -50%); filter: drop-shadow(2px 4px 2px #24311966); pointer-events: none; }
      .harvest-grape svg { width: 100%; height: 100%; }
      .harvest-grape-symbol { position: absolute; right: -6px; bottom: 0; padding: 0 4px; background: #23311f; border: 1px solid currentColor; border-radius: 50%; font-size: 16px; line-height: 22px; }
      .harvest-cue { font-weight: bold; font-size: 1.25rem; min-height: 1.5em; }
      .harvest-feedback { min-height: 1.5em; font-weight: bold; }
      .harvest-controls { display: flex; flex-wrap: wrap; justify-content: center; }
      #harvest-board .harvest-steer { touch-action: none; user-select: none; min-width: 120px; font-size: 1.1rem; }
      .harvest-field[data-feedback="correct"] { border-color: #b3df79; }
      .harvest-field[data-feedback="wrong"] { border-color: #f38b79; }
      @media (max-width: 480px) {
        #harvest-board section { padding: 8px; }
        .harvest-basket svg { height: 68px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <button id="preview-sound" type="button" aria-pressed="true"></button>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <div id="harvest-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Francais</a></p>
    </main>
    <script type="module" src="./harvest-preview.mjs"></script>
  </body>
</html>
