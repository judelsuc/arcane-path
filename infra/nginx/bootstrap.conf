server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name arcane-path.eu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arcane-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
