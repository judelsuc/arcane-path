server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name arcane-path.eu www.arcane-path.eu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arcane-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /api/characters {
        client_max_body_size 4k;
        limit_except POST { deny all; }
        return 503;
    }
    location = /api/town-content {
        client_max_body_size 4k;
        limit_except POST { deny all; }
        return 503;
    }
    location = /api/inscriptions {
        client_max_body_size 4k;
        limit_except POST { deny all; }
        return 503;
    }
    location = /api/change-requests {
        client_max_body_size 4100000;
        limit_except POST { deny all; }
        return 503;
    }
    location / { return 503; }
}
