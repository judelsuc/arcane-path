map $uri $arcane_api_client {
    default "";
    ~^/api/ $binary_remote_addr;
}

limit_req_zone $arcane_api_client zone=arcane_api_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=arcane_creation:1m rate=10r/m;
limit_conn_zone $arcane_api_client zone=arcane_api_connections:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name arcane-path.eu www.arcane-path.eu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arcane-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://arcane-path.eu$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arcane-path.eu www.arcane-path.eu;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/arcane-path.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcane-path.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:arcane_tls:1m;

    auth_basic "Arcane Path private preview";
    auth_basic_user_file /etc/nginx/arcane-preview.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;

    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_req zone=arcane_api_requests burst=100 nodelay;
    limit_req_status 429;
    limit_conn arcane_api_connections 20;
    limit_conn_status 429;
    error_page 429 = @rate_limited;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_hide_header Cache-Control;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"error":"Too many preview requests; wait before retrying."}';
    }
    location = / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/journeys {
        limit_except POST { deny all; }
        limit_req zone=arcane_api_requests burst=100 nodelay;
        limit_req zone=arcane_creation burst=5 nodelay;
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/abandoned-journals {
        client_max_body_size 68m;
        client_body_timeout 90s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/journal-art {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/live-narrative {
        limit_except POST { deny all; }
        limit_req zone=arcane_api_requests burst=100 nodelay;
        proxy_pass http://127.0.0.1:8766;
    }
    location ~ ^/api/start-art(?:/image)?$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location = /api/living-world {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location ~ ^/(?:layers/living-world/(?:preview\.html|(?:preview|agenda|demo)\.mjs)|layers/transport/(?:(?:routes|hybrid)\.html|(?:routes|hybrid|hybrid-preview|transport)\.mjs)|data/transport/(?:europe-catalog\.json|verified-feeds\.json|CATALOG-LICENSE|README\.md|samples/[a-z0-9-]+\.json|examples/grenoble-lyon/(?:[a-z0-9-]+\.json|README\.md)))$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location ~ "^/api/(?:travel|origins|origin|origin-map|places|location|pricing-country|accommodations|chunk|chunks-cached|journey-terrain|journey-transport|weather|trail|parent-path|journeys/[a-f0-9]{32})$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location ~ ^/(?:index\.html|app\.js|styles\.css|mini-games\.css|cafe-art\.svg|[a-z][a-z0-9-]*\.mjs|minigames/[a-z][a-z0-9-]*\.(?:mjs|svg)|public/(?:config\.json|economy\.json|narrative-briefs\.json|map\.json|release\.json|changelog\.json|maps/(?:alps|paris|tahiti)\.json|tarot/(?:[a-z]+\.jpg|CREDITS\.txt)|audio/(?:music|sfx)/[^/]+\.(?:wav|mp3|ogg))|data/regions\.json)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766;
    }
    location / { return 404; }
}
