<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>European transport sources</title>
  <style>
    body { margin: 2rem auto; padding: 0 1rem; max-width: 1100px; font: 16px/1.5 system-ui, sans-serif; color: #233337; background: #f6f4ee; }
    h1, h2 { line-height: 1.2; }
    label { display: inline-block; margin: .5rem 1rem .5rem 0; }
    select, input { padding: .4rem; max-width: 100%; font: inherit; }
    table { width: 100%; border-collapse: collapse; background: #fffdf7; }
    td, th { padding: .6rem; border-bottom: 1px solid #c5cdc3; text-align: left; overflow-wrap: anywhere; }
    a { color: #205c72; }
    .notice { border-left: 4px solid #b27728; background: #fff5df; padding: 1rem; }
    article { margin: 1rem 0; padding: 1rem; background: #fffdf7; border: 1px solid #c5cdc3; }
    #error { color: #a22424; font-weight: bold; }
    .scroll { overflow: auto; }
    .hash { overflow-wrap: anywhere; font-size: .8rem; }
  </style>
</head>
<body>
  <label><span id="languageLabel">Langue</span> <select id="language" aria-label="Language"><option value="fr">Francais</option><option value="en">English</option></select></label>
  <h1 id="title"></h1>
  <p id="warning" class="notice"></p>
  <p id="error" role="alert"></p>
  <p id="summary" role="status"></p>
  <p><a id="hybridLink" href="./hybrid.html"></a></p>
  <h2 id="catalogTitle"></h2>
  <label><span id="countryLabel"></span> <select id="country" disabled></select></label>
  <label><span id="filterLabel"></span> <input id="filter" type="search" disabled></label>
  <p id="count" role="status"></p>
  <div class="scroll"><table><thead><tr><th id="operatorHeading"></th><th id="sourceHeading"></th><th id="statusHeading"></th><th id="licenseHeading"></th></tr></thead><tbody id="feeds"></tbody></table></div>
  <h2 id="verifiedTitle"></h2>
  <p id="sampleWarning"></p>
  <div id="verified"></div>
  <p><a id="catalogLink" href="../../data/transport/europe-catalog.json"></a> · <a id="documentationLink" href="../../data/transport/README.md"></a></p>
  <script type="module" src="./routes.mjs"></script>
</body>
</html>
