<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market stall - game 12</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 1000px; margin: 1rem auto; padding: 1rem; }
      #market-board { padding: 22px; border: 2px solid #b49165; border-top: 22px solid #ad6651; border-radius: 12px; background: #2e3e33; }
      #market-board .market-art { display: block; width: 76px; height: 76px; flex-shrink: 0; }
      .market-shopping-list { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px; list-style: none; color: #443b2a; background: #e9dfc7; border-radius: 6px; }
      .market-shopping-list li { display: flex; align-items: center; gap: 10px; flex: 1 1 210px; }
      .market-crates { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr)); gap: 14px; margin: 18px 0; }
      .market-crates label { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: 4px solid #967047; border-bottom: 10px solid #967047; background: #243029; text-align: center; }
      .market-crates input { width: 75px; min-height: 42px; text-align: center; font-size: 1.15rem; }
      .market-packed-basket { display: flex; align-items: center; gap: 15px; padding: 12px; background: #202d25; border-radius: 8px; }
      .market-packed-basket > div { display: flex; flex-wrap: wrap; gap: 14px; }
      .market-packed-basket > div > span { display: flex; align-items: center; gap: 6px; }
      #market-board .market-packed-basket > div .market-art { width: 40px; height: 40px; }
      .market-till { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 145px), 1fr)); gap: 12px; margin: 18px 0; }
      .market-till button { position: relative; padding: 4px; background: #26332c; color: #f5e4bb; min-height: 80px; }
      .market-money-art { display: block; width: 90px; max-width: 100%; height: 60px; margin: auto; }
      .market-till button span { display: block; font-weight: bold; }
      .market-tender { display: inline-flex; align-items: center; gap: 12px; padding: 8px 15px; background: #1c2a22; border: 1px solid #729b80; border-radius: 6px; margin-bottom: 12px; }
      #market-board [role="timer"] { color: #f4cf87; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
      #market-board button:focus-visible, #market-board input:focus-visible { outline: 3px solid #f4cf87; outline-offset: 3px; }
      #market-board form > button { margin: 8px 8px 8px 0; }
      .market-scale { margin: 16px 0; padding: 14px; border: 1px solid #c6aa67; border-radius: 10px; background: #203129; text-align: center; }
      .market-scale svg { display: block; width: min(100%, 340px); margin: auto; }
      .market-scale button { margin: 5px; min-height: 42px; }
      .market-drawer-summary { padding: 12px; border: 1px solid #b49165; border-radius: 6px; line-height: 1.8; overflow-wrap: anywhere; }
      .market-cash-slot { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #1c2a22; border-radius: 8px; text-align: center; }
      #market-board .market-cash-slot > button { width: 100%; min-height: 42px; }
      #market-board button:disabled { opacity: .4; cursor: not-allowed; }
      .market-extra { margin: 12px 0; padding: 12px; border: 1px solid #729b80; border-radius: 6px; }
      .market-extra button { margin: 8px; min-height: 42px; }
      #market-board input[name="change"], #market-board input[name="extra"] { width: 100px; min-height: 38px; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <button id="preview-sound" type="button" aria-pressed="true"></button>
      <p id="preview-difficulty"></p>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <p id="preview-audio-error" role="alert"></p>
      <div id="market-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Français</a></p>
    </main>
    <script type="module" src="./market-preview.mjs"></script>
  </body>
</html>
