<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Street music - game 2</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main style="max-width: 880px; margin: 2rem auto; padding: 1rem">
      <h1>Street music - game 2</h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option>
      </select>
      <button id="open-music" type="button" data-i18n="musicOpen" disabled></button>
      <p id="preview-status" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Francais</a></p>
      <p><a href="./cafe-preview.html">Game 1: Cafe rush</a></p>
    </main>
    <script type="module" src="./music-preview.mjs"></script>
  </body>
</html>
