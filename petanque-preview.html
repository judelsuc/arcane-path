<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Village petanque - game 8</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 900px; margin: 1rem auto; padding: 1rem; }
      #petanque-board { padding: 18px; background: #34453b; border: 2px solid #ad9871; border-radius: 12px; text-align: center; }
      #petanque-board button { margin: 6px; min-height: 48px; padding: 10px 16px; border-radius: 8px; }
      .petanque-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
      .petanque-controls label { display: flex; flex-direction: column; gap: 8px; }
      .petanque-pitch { box-shadow: inset 0 0 20px #63482055; border-radius: 8px; }
      .petanque-aim { z-index: 1; }
      .petanque-jack, .petanque-ball, .petanque-boule { z-index: 2; }
      .petanque-ball { box-shadow: inset -2px -2px 3px #1119, inset 2px 2px 3px #fffa, 1px 2px 2px #4328; }
      .petanque-jack { border: 1px solid #634820; box-shadow: 1px 2px 2px #4328; }
      .petanque-status, .petanque-score { font-weight: bold; color: #f1dba3; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <button id="preview-sound" type="button" aria-pressed="true"></button>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <div id="petanque-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Francais</a></p>
    </main>
    <script type="module" src="./petanque-preview.mjs"></script>
  </body>
</html>
