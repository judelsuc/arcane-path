<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Postcard sketch - game 7</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 900px; margin: 1rem auto; padding: 1rem; }
      #sketch-board { padding: 18px; background: #34453b; border: 2px solid #ad9871; border-radius: 12px; }
      #sketch-board section { text-align: center; }
      #sketch-board pre { width: fit-content; margin: 20px auto; padding: 20px; font: bold 34px/1.2 monospace; letter-spacing: 10px; color: #423624; background: #f0e3c4; border: 8px solid #c7ac78; border-radius: 8px; white-space: pre; }
      #sketch-board .sketch-revealed pre { max-width: 100%; box-sizing: border-box; padding: 8px; border-width: 4px; font-size: clamp(12px, 3vw, 28px); letter-spacing: 0; }
      .sketch-comparison h3 { font-size: 1rem; }
      #sketch-board button { margin: 6px; min-height: 48px; padding: 10px 16px; border-radius: 8px; }
      #sketch-board [role="group"] { width: fit-content; max-width: 100%; margin: 20px auto; padding: 8px; background: #f0e3c4; border: 4px solid #c7ac78; border-radius: 8px; }
      #sketch-board [role="group"] button { box-sizing: border-box; width: 44px; height: 44px; margin: 1px; padding: 0; min-height: 44px; color: #b09a73; background: #f6eedb; border: 1px solid #b7a37b; border-radius: 2px; font-size: 24px; }
      #sketch-board [role="group"] button[aria-pressed="true"] { background: #3e574d; color: #f4deb3; }
      #sketch-board [aria-label="Colours"] button, #sketch-board [aria-label="Couleurs"] button { background: #f0e3c4; border: 2px solid #ad9871; }
      #sketch-board [aria-label="Colours"] button[aria-pressed="true"], #sketch-board [aria-label="Couleurs"] button[aria-pressed="true"] { border-color: #f5d477; box-shadow: 0 0 0 3px #f5d477; }
      @media (max-width: 420px) {
        main { padding: 8px; }
        #sketch-board { padding: 8px; }
        #sketch-board [role="group"] { padding: 0; border-width: 2px; }
        #sketch-board [role="group"] button { margin: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <div id="sketch-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Francais</a></p>
    </main>
    <script type="module" src="./sketch-preview.mjs"></script>
  </body>
</html>
