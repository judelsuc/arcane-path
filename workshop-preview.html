<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bicycle workshop - game 6</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      main { max-width: 1080px; margin: 1rem auto; padding: 1rem; }
      #workshop-board { padding: 20px; background: #293c34; border: 1px solid var(--line); border-radius: 14px; }
      #workshop-board button { margin: 8px; min-height: 56px; padding: 12px 18px; border-radius: 10px; }
      #workshop-board p, #workshop-board li { line-height: 1.6; }
      .workshop-bikes { position: sticky; top: 76px; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; background: #293c34; }
      .workshop-bike-panel { border: 2px solid #60796e; border-radius: 14px; background: radial-gradient(ellipse at top, #547e69, #304b41); text-align: center; overflow: hidden; }
      .workshop-bike-panel h3 { margin: 10px; color: #f0dfb0; }
      .workshop-model { border-color: #e5c379; }
      .workshop-bike-art { display: block; width: 100%; height: auto; }
      .workshop-countdown { position: sticky; top: 8px; z-index: 2; width: fit-content; margin: 12px auto; padding: 8px 24px; font-size: 1.5rem; font-weight: bold; color: #f7e1a7; background: #182f26; border: 2px solid #cfb578; border-radius: 12px; font-variant-numeric: tabular-nums; }
      .workshop-countdown[data-urgent="true"] { color: #ffd4ce; background: #6f322c; border-color: #ef9585; }
      .workshop-progress, .workshop-feedback { text-align: center; }
      .workshop-feedback { min-height: 1.6em; color: #f2dda5; }
      .workshop-categories { display: flex; flex-wrap: wrap; justify-content: center; }
      #workshop-board .workshop-categories button { margin: 4px; padding: 8px 12px; border: 2px solid #647c70; }
      #workshop-board button[aria-pressed="true"] { background: #536c37; border-color: #f1d18a; box-shadow: inset 0 0 0 2px #f1d18a; }
      .workshop-categories button[data-fitted="true"]::after { content: " +"; color: #c2e8b9; }
      .workshop-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
      #workshop-board .workshop-choices button { margin: 0; padding: 6px; border: 2px solid #748b7b; background-color: #20382e; }
      .workshop-part-art { display: block; width: 100%; height: 100px; }
      .workshop-choices span { display: block; margin: 6px 0; }
      .workshop-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
      .workshop-part-comparison { padding: 8px; text-align: center; border: 1px solid #81957a; border-radius: 10px; background: #20382e; }
      .workshop-part-comparison p { margin: 0 0 6px; color: #f0dfb0; font-weight: bold; }
      @media (max-width: 540px) {
        #workshop-board { padding: 10px; }
        .workshop-bikes { gap: 6px; }
        .workshop-bike-panel h3 { font-size: 0.9rem; }
        .workshop-choices { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
        .workshop-part-art { height: 70px; }
        #workshop-board .workshop-choices button { font-size: 0.75rem; padding: 4px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="preview-title"></h1>
      <p id="preview-note"></p>
      <label for="preview-level" id="preview-level-label"></label>
      <select id="preview-level">
        <option value="0">0</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      </select>
      <button id="preview-reset" type="button"></button>
      <button id="preview-sound" type="button" aria-pressed="true"></button>
      <p id="preview-result" role="status"></p>
      <p id="preview-error" role="alert"></p>
      <div id="workshop-board"></div>
      <p><a href="?lang=en">English</a> / <a href="?lang=fr">Francais</a></p>
    </main>
    <script type="module" src="./workshop-preview.mjs"></script>
  </body>
</html>
